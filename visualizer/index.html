  <script src="https://unpkg.com/marked/marked.min.js"></script>

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #03122c 0%, #020a1c 55%, #010612 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    #3d-graph {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 仿生全息斯塔克 HUD 边框与暗角 */
    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: radial-gradient(circle at center, transparent 45%, rgba(1, 6, 18, 0.75) 98%);
      box-shadow: inset 0 0 100px rgba(2, 20, 50, 0.5);
    }
    .hud-corner {
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: rgba(56, 189, 248, 0.4);
    }
    .hud-corner-tl { top: 16px; left: 16px; border-top: 2px solid; border-left: 2px solid; }
    .hud-corner-tr { top: 16px; right: 16px; border-top: 2px solid; border-right: 2px solid; }
    .hud-corner-bl { bottom: 16px; left: 16px; border-bottom: 2px solid; border-left: 2px solid; }
    .hud-corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid; border-right: 2px solid; }

    /* 深海神经元毛玻璃舱 */
    .glass-deck {
      background: rgba(4, 13, 33, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 45px rgba(1, 8, 24, 0.9), inset 0 0 25px rgba(56, 189, 248, 0.08);
    }
    .hud-panel {
      background: rgba(3, 11, 28, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.18);
    }

    /* 悬浮轻量 Tooltip */
    #hoverTooltip {
      position: absolute;
      z-index: 30;
      pointer-events: none;
      transform: translate(-50%, -120%);
      transition: opacity 0.15s ease-out;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(3, 11, 28, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 2px; }
  </style>
</head>

  <!-- 核心逻辑脚本 -->
  <script>
    let graphData = {
      nodes: JSON.parse(JSON.stringify(BRAIN_GRAPH_DATA.nodes)),
      links: JSON.parse(JSON.stringify(BRAIN_GRAPH_DATA.links))
    };

    let selectedNode = null;
    let hiddenGroups = new Set();
    let isRecognizing = false;
    let recognition = null;

    // 动态生成发光辉光纹理 (Radial Glow Texture，复刻参考图的霓虹核芯光晕效果)
    function createGlowTexture(colorHex, isBright = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const cx = 64, cy = 64;

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 64);
      grad.addColorStop(0, '#ffffff'); // 白热发光核
      grad.addColorStop(0.25, colorHex);
      grad.addColorStop(0.6, colorHex + (isBright ? '88' : '44'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // 1. 初始化 3D Force Graph 实例
    const elem = document.getElementById('3d-graph');
    const Graph = ForceGraph3D()(elem)
      .graphData(graphData)
      .backgroundColor('rgba(1, 6, 18, 0)') // 透明背景融入 body 渐变
      .showNavInfo(false)
      // 突触连线发光与脉冲 (模拟参考图的光纤神经网络)
      .linkColor(() => 'rgba(56, 189, 248, 0.45)')
      .linkWidth(1.2)
      .linkCurvature(d => d.curvature || 0.1)
      .linkDirectionalParticles(4)
      .linkDirectionalParticleSpeed(0.007)
      .linkDirectionalParticleWidth(2.4)
      .linkDirectionalParticleColor(() => '#e0f2fe')
      // 节点定制：复刻参考图的【白光核芯 + 泛光光晕 + 文字 Sprite】
      .nodeThreeObject(node => {
        const group = new THREE.Group();
        const baseRadius = Math.sqrt(node.val || 10) * 1.5;

        // 1. 中心高亮核芯球体 (Bright Core)
        const coreGeo = new THREE.SphereGeometry(baseRadius, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({
          color: node.coreColor || '#ffffff'
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh);

        // 2. 外部霓虹辉光 Sprite (Glow Halo - Additive Blending)
        const glowTex = createGlowTexture(node.color || '#38bdf8', node.group === 'CORE');
        const glowMat = new THREE.SpriteMaterial({
          map: glowTex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          opacity: 0.9
        });
        const glowSprite = new THREE.Sprite(glowMat);
        const glowScale = baseRadius * 7.5;
        glowSprite.scale.set(glowScale, glowScale, 1);
        group.add(glowSprite);

        // 3. 悬浮文字标签 Sprite
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(2, 10, 28, 0.82)';
        ctx.roundRect(0, 0, 256, 64, 12);
        ctx.fill();
        ctx.strokeStyle = node.color || '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(node.name, 128, 32);

        const labelTex = new THREE.CanvasTexture(canvas);
        const labelMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true });
        const labelSprite = new THREE.Sprite(labelMat);
        labelSprite.scale.set(28, 7, 1);
        labelSprite.position.set(0, baseRadius + 7, 0);
        group.add(labelSprite);

        return group;
      })
      .onNodeHover((node, prevNode) => {
        const tooltip = document.getElementById('hoverTooltip');
        if (node) {
          document.getElementById('tt-title').innerText = node.name;
          document.getElementById('tt-group').innerText = node.group;
          document.getElementById('tt-time').innerText = node.createdAt || '2026-10-21 09:20';
          document.getElementById('tt-glow').style.backgroundColor = node.color || '#38bdf8';
          tooltip.classList.remove('opacity-0');
        } else {
          tooltip.classList.add('opacity-0');
        }
      })
      .onNodeClick(node => focusOnNode(node));

    // 移动 Tooltip 跟随鼠标
    window.addEventListener('mousemove', e => {
      const tooltip = document.getElementById('hoverTooltip');
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
    });

    // 增强深邃环境质感：添加迷雾与背景神经尘埃粒子 (Ambient Neural Dust)
    const scene = Graph.scene();
    scene.fog = new THREE.FogExp2(0x010816, 0.0016);

    // 注入 220 颗微弱散落的背景神经元星尘，形成参考图中的景深感
    const dustGeo = new THREE.BufferGeometry();
    const dustCount = 220;
    const dustPositions = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount * 3; i += 3) {
      dustPositions[i] = (Math.random() - 0.5) * 800;
      dustPositions[i + 1] = (Math.random() - 0.5) * 800;
      dustPositions[i + 2] = (Math.random() - 0.5) * 800;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 2.2,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending
    });
    const dustParticles = new THREE.Points(dustGeo, dustMat);
    scene.add(dustParticles);

    // 环境光与微弱冷光源
    scene.add(new THREE.AmbientLight(0x0284c7, 0.6));
    const pointLight = new THREE.PointLight(0xffffff, 1.2, 500);
    pointLight.position.set(0, 50, 100);
    scene.add(pointLight);

    // 2. 镜头平滑聚焦节点
    function focusOnNode(node) {
      selectedNode = node;
      const distance = 110;
      const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

      Graph.cameraPosition(
        { x: node.x * distRatio, y: node.y * distRatio + 18, z: node.z * distRatio },
        node,
        1800
      );

      openSideDeck(node);
    }

    function resetCamera() {
      Graph.cameraPosition({ x: 0, y: 0, z: 360 }, { x: 0, y: 0, z: 0 }, 1500);
    }

    // 3. 右侧毛玻璃数据舱控制 (展示：想法是什么、什么时间创建的等)
    function openSideDeck(node) {
      document.getElementById('deckTitle').innerText = node.name;
      document.getElementById('deckDesc').innerText = node.desc || '暂无主旨描述';
      document.getElementById('deckFile').innerText = node.file || '未指定文件';
      document.getElementById('deckBadge').innerText = node.group || 'NEURON';
      document.getElementById('deckCreatedAt').innerText = node.createdAt || '2026-10-21 09:20:00';

      // 计算相对时间提示
      const timeStr = node.createdAt || '2026-10-21';
      document.getElementById('deckAge').innerText = timeStr.includes('2026-10-22') ? '今日活跃' : '历史资产';

      const contentHtml = marked.parse(node.fullContent || node.desc || '*暂无详细内容*');
      document.getElementById('deckContent').innerHTML = contentHtml;

      document.getElementById('sideDeck').classList.remove('translate-x-[420px]');
    }

    function closeSideDeck() {
      document.getElementById('sideDeck').classList.add('translate-x-[420px]');
    }

    // 4. 分类过滤逻辑
    function toggleGroupFilter(group) {
      const btn = document.getElementById('filter-' + group);
      if (hiddenGroups.has(group)) {
        hiddenGroups.delete(group);
        btn.classList.remove('opacity-40');
      } else {
        hiddenGroups.add(group);
        btn.classList.add('opacity-40');
      }

      const filteredNodes = graphData.nodes.filter(n => !hiddenGroups.has(n.group));
      const activeIds = new Set(filteredNodes.map(n => n.id));
      const filteredLinks = graphData.links.filter(l => {
        const srcId = typeof l.source === 'object' ? l.source.id : l.source;
        const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
        return activeIds.has(srcId) && activeIds.has(tgtId);
      });

      Graph.graphData({ nodes: filteredNodes, links: filteredLinks });
      updateTelemetry();
    }

    // 5. 搜索雷达
    function onSearch(query) {
      if (!query.trim()) return;
      const target = graphData.nodes.find(n => n.name.toLowerCase().includes(query.toLowerCase()) || (n.createdAt && n.createdAt.includes(query)));
      if (target) {
        focusOnNode(target);
      }
    }

    // 6. UI 注入新神经元逻辑 (自动注入精准创建时间戳)
    function openSpawnModal(preselectedParentId = null) {
      const select = document.getElementById('m_parent');
      select.innerHTML = '<option value="core-root">GL 个人大脑中枢 (默认)</option>' +
        graphData.nodes.map(n => `<option value="${n.id}" ${n.id === preselectedParentId ? 'selected' : ''}>${n.name} (${n.group})</option>`).join('');

      document.getElementById('m_name').value = '';
      document.getElementById('m_desc').value = '';
      document.getElementById('m_content').value = '';
      document.getElementById('spawnModal').classList.remove('hidden');
    }

    function closeSpawnModal() {
      document.getElementById('spawnModal').classList.add('hidden');
    }

    function spawnChildFromCurrent() {
      if (selectedNode) {
        openSpawnModal(selectedNode.id);
      } else {
        openSpawnModal();
      }
    }

    async function submitNewNeuron() {
      const name = document.getElementById('m_name').value.trim();
      const group = document.getElementById('m_group').value;
      const parentId = document.getElementById('m_parent').value || 'core-root';
      const desc = document.getElementById('m_desc').value.trim();
      const content = document.getElementById('m_content').value.trim();

      if (!name) {
        alert("请输入神经元名称！");
        return;
      }

      const colorMap = {
        CORE: '#fbbf24',
        PROJECT: '#06b6d4',
        IDEA: '#38bdf8',
        SKILL: '#a855f7',
        MEMORY: '#10b981'
      };

      const fileMap = {
        CORE: 'preferences.md',
        PROJECT: 'projects.md',
        IDEA: 'ideas.md',
        SKILL: 'cinematic/assets-methodology.md',
        MEMORY: 'memory-log.md'
      };

      // 实时获取精准时间戳 YYYY-MM-DD HH:mm:ss
      const now = new Date();
      const createdAt = now.toISOString().replace('T', ' ').slice(0, 19);

      const newId = 'n-' + Date.now();
      const newNode = {
        id: newId,
        name: name,
        group: group,
        val: 14,
        color: colorMap[group] || '#38bdf8',
        coreColor: '#ffffff',
        createdAt: createdAt,
        desc: desc || name,
        file: fileMap[group] || 'ideas.md',
        fullContent: content ? `### ${name}\n- **创建时间**：\`${createdAt}\`\n\n${content}` : `### ${name}\n- **创建时间**：\`${createdAt}\`\n\n${desc}`
      };

      const newLink = {
        source: parentId,
        target: newId,
        curvature: 0.15
      };

      // 实时向 3D 拓扑长出新神经元
      graphData.nodes.push(newNode);
      graphData.links.push(newLink);
      Graph.graphData(graphData);

      closeSpawnModal();
      updateTelemetry();

      // 镜头平滑飞向新长出的神经元
      setTimeout(() => {
        focusOnNode(newNode);
      }, 350);

      // 调用后端 API 自动持久化写入 Markdown 和 brain-data.js
      try {
        const res = await fetch('/api/neuron', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ node: newNode, link: newLink })
        });
        const result = await res.json();
        if (result.success) {
          jarvisSpeak(`Sir, 新神经元 ${newNode.name} 已于 ${createdAt} 成功接入，并归档至 ${newNode.file}`);
        }
      } catch (e) {
        console.warn("后端持久化离线模式：", e);
      }
    }

    // 7. 实时遥测指标
    function updateTelemetry() {
      document.getElementById('tele-nodes').innerText = graphData.nodes.length;
      document.getElementById('tele-links').innerText = graphData.links.length;
    }
    updateTelemetry();

    // 8. 贾维斯语音交互与声波环 (Web Speech API)
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('voiceStatus').innerText = "NO MIC API";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'zh-CN';

      recognition.onstart = () => {
        isRecognizing = true;
        document.getElementById('voiceStatus').innerText = "LISTENING";
        document.getElementById('voiceStatus').className = "text-[9px] font-mono text-cyan-400 font-bold animate-pulse";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.trim();
        handleVoiceCommand(text);
      };

      recognition.onerror = () => { stopVoiceRecognition(); };
      recognition.onend = () => { stopVoiceRecognition(); };
    }

    function toggleVoiceRecognition() {
      if (isRecognizing) stopVoiceRecognition();
      else startVoiceRecognition();
    }

    function startVoiceRecognition() {
      if (!recognition) initSpeechRecognition();
      if (recognition && !isRecognizing) {
        try { recognition.start(); } catch (e) {}
      }
    }

    function stopVoiceRecognition() {
      isRecognizing = false;
      document.getElementById('voiceStatus').innerText = "STANDBY";
      document.getElementById('voiceStatus').className = "text-[9px] font-mono text-slate-400";
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    // 空格键对讲
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && !isRecognizing) {
        e.preventDefault();
        startVoiceRecognition();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && isRecognizing) {
        stopVoiceRecognition();
      }
    });

    // 贾维斯指令解析器
    function handleVoiceCommand(cmd) {
      console.log("J.A.R.V.I.S. Command Received:", cmd);

      // 指令 1: 聚焦 [名称]
      if (cmd.includes("聚焦") || cmd.includes("查看") || cmd.includes("打开")) {
        const keyword = cmd.replace(/(聚焦|查看|打开|神经元)/g, '').trim();
        const matched = graphData.nodes.find(n => n.name.includes(keyword) || keyword.includes(n.name));
        if (matched) {
          focusOnNode(matched);
          jarvisSpeak(`已为您聚焦 ${matched.name}。该神经元创建于 ${matched.createdAt}。${matched.desc}`);
        } else {
          jarvisSpeak(`抱歉 Sir，未找到包含 ${keyword} 的神经元。`);
        }
        return;
      }

      // 指令 2: 记录新想法 [内容]
      if (cmd.includes("记录新想法") || cmd.includes("记录想法") || cmd.includes("新增想法")) {
        const ideaText = cmd.replace(/(记录新想法|记录想法|新增想法)/g, '').trim() || "未命名语音想法";
        openSpawnModal(selectedNode ? selectedNode.id : 'core-root');
        document.getElementById('m_group').value = 'IDEA';
        document.getElementById('m_name').value = ideaText.slice(0, 18);
        document.getElementById('m_desc').value = ideaText;
        submitNewNeuron();
        return;
      }

      // 指令 3: 汇报状态
      if (cmd.includes("汇报状态") || cmd.includes("状态") || cmd.includes("汇报")) {
        jarvisSpeak(`Sir, 当前大脑共有 ${graphData.nodes.length} 个神经元，已建立 ${graphData.links.length} 条仿生突触连线，仿生星图运转正常。`);
        return;
      }

      // 默认模糊匹配
      const matched = graphData.nodes.find(n => n.name.includes(cmd) || cmd.includes(n.name));
      if (matched) {
        focusOnNode(matched);
        jarvisSpeak(`已定位至 ${matched.name}，创建时间 ${matched.createdAt}。`);
      } else {
        jarvisSpeak(`指令已接收：${cmd}。请下达聚焦或记录想法指令。`);
      }
    }

    function jarvisSpeak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 1.05;
      utterance.pitch = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentNeuron() {
      if (selectedNode) {
        jarvisSpeak(`${selectedNode.name}。创建时间：${selectedNode.createdAt}。${selectedNode.desc}`);
      }
    }

    // 9. 声波动态同心圆绘制 Canvas
    const vCanvas = document.getElementById('voiceCanvas');
    const vCtx = vCanvas.getContext('2d');
    let waveAngle = 0;

    function drawVoiceWave() {
      vCtx.clearRect(0, 0, 112, 112);
      waveAngle += isRecognizing ? 0.08 : 0.02;

      const cx = 56, cy = 56;
      const baseR = 46;

      vCtx.save();
      vCtx.translate(cx, cy);

      // 外环波形
      vCtx.beginPath();
      for (let i = 0; i < Math.PI * 2; i += 0.1) {
        const amp = isRecognizing ? Math.sin(i * 6 + waveAngle * 4) * 5 : Math.sin(i * 4 + waveAngle) * 2;
        const r = baseR + amp;
        const x = Math.cos(i) * r;
        const y = Math.sin(i) * r;
        if (i === 0) vCtx.moveTo(x, y);
        else vCtx.lineTo(x, y);
      }
      vCtx.closePath();
      vCtx.strokeStyle = isRecognizing ? '#38bdf8' : 'rgba(56, 189, 248, 0.4)';
      vCtx.lineWidth = isRecognizing ? 2 : 1;
      vCtx.stroke();

      // 内环旋转光标
      vCtx.beginPath();
      vCtx.arc(0, 0, 36, waveAngle, waveAngle + 1.2);
      vCtx.strokeStyle = isRecognizing ? '#e0f2fe' : 'rgba(56, 189, 248, 0.5)';
      vCtx.lineWidth = 2;
      vCtx.stroke();

      vCtx.restore();
      requestAnimationFrame(drawVoiceWave);
    }
    drawVoiceWave();
    initSpeechRecognition();

    // 10. 云端 GitHub 同步
    async function syncToGitHub() {
      const btn = document.getElementById('btn-sync');
      const icon = document.getElementById('sync-icon');
      const text = document.getElementById('sync-text');

      icon.innerText = "⏳";
      text.innerText = "正在推送到 GitHub...";
      btn.classList.add('opacity-50');

      try {
        const res = await fetch('/api/github-sync', { method: 'POST' });
        const result = await res.json();
        if (result.success) {
          icon.innerText = "✅";
          text.innerText = "已同步到 GitHub!";
          jarvisSpeak("Sir, 个人大脑已全量同步至 GitHub 云端仓库。");
        } else {
          icon.innerText = "⚠️";
          text.innerText = "同步异常";
        }
      } catch (e) {
        icon.innerText = "⚠️";
        text.innerText = "离线完成";
      } finally {
        setTimeout(() => {
          icon.innerText = "☁️";
          text.innerText = "同步至 GitHub";
          btn.classList.remove('opacity-50');
        }, 3000);
      }
    }
  </script>
</body>
